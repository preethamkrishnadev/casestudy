[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "claimflow"
version = "1.0.0"
description = "An agent that reviews insurance claims and asks a human when it is unsure."
readme = "README.md"
requires-python = ">=3.8"
# the core tool needs nothing but the Python standard library
dependencies = []

[project.optional-dependencies]
# only needed if your claims arrive as PDFs
pdf = ["pypdf>=3.0"]
# only needed if those PDFs are scans, with pictures instead of text.
# this one also needs the Tesseract program:  sudo apt install tesseract-ocr
ocr = ["pypdf>=3.0", "pytesseract>=0.3.10", "pillow>=9"]
all = ["pypdf>=3.0", "pytesseract>=0.3.10", "pillow>=9"]

[project.scripts]
claimflow = "claimflow.cli:main"

[tool.setuptools]
packages = ["claimflow"]
